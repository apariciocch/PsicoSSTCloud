networks:
  psicosst-network:
    driver: bridge
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psicosst-backend
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENVIRONMENT: development
      JWT_EXPIRATION: 900
      JWT_REFRESH_EXPIRATION: 604800
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_key_min_32_characters_long_here_xxxx}
      LOG_FORMAT: json
      LOG_LEVEL: info
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-admin@example.com}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-secure_password}
      POCKETBASE_URL: http://pocketbase:8090
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW: 60
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8080/health
      timeout: 10s
    networks:
    - psicosst-network
    ports:
    - 8080:8080
    restart: unless-stopped
    volumes:
    - ./backend:/app
    - backend_storage:/app/storage
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: pocketbase
    environment:
    - POCKETBASE_AUTO_BACKUP=true
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8090/api/health
      timeout: 5s
    networks:
    - psicosst-network
    ports:
    - 8090:8090
    restart: unless-stopped
    volumes:
    - pocketbase_data:/pb_data
    - ./pocketbase:/pb_public
version: '3.9'
volumes:
  backend_storage:
    driver: local
  pocketbase_data:
    driver: local
